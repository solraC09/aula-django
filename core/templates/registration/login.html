{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="pagina-form">
    <h1>Entrar</h1>

    {% if form.errors %}
        <p class="erro">Usuário ou senha incorretos.</p>
    {% endif %}

    <form method="post" class="form-livro">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="botao-principal">Entrar</button>
    </form>
</div>
{% endblock %}
