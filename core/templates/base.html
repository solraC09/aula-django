{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Acervo da Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% if user.is_authenticated %}
<header class="topo">
    <a href="{% url 'inicio' %}" class="topo-marca">Acervo</a>
    <span class="topo-org">{{ user.perfil.organizacao|default:"sem organização" }}</span>
    <span class="topo-usuario">{{ user.username }} · {{ user.perfil.get_papel_display }}</span>
    <form method="post" action="{% url 'logout' %}" class="form-sair">
        {% csrf_token %}
        <button type="submit">Sair</button>
    </form>
</header>
{% endif %}

{% block conteudo %}{% endblock %}

</body>
</html>
