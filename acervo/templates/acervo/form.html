{% extends "base.html" %}

{% block titulo %}{{ titulo_pagina }}{% endblock %}

{% block conteudo %}
<div class="pagina-form">
    <h1>{{ titulo_pagina }}</h1>

    <form method="post" class="form-livro">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="botao-principal">Salvar</button>
    </form>

    <div class="acoes-form">
        <a href="{% url 'autores' %}?next={{ request.path|urlencode }}" class="botao-secundario botao-pequeno">Cadastrar novo autor</a>
        <a href="{% url 'lista' %}" class="botao-secundario botao-pequeno">Voltar para o acervo</a>
    </div>
</div>
{% endblock %}
